<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工程表アプリ</title>
<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --accent:#2563eb;
  --accent-soft:#dbeafe;
  --border:#e5e7eb;
  --danger:#dc2626;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;
  color:var(--text);
  background:var(--bg);
}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--card);
  border-bottom:1px solid var(--border);
}
header .inner{
  max-width:1100px;
  margin:0 auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
header h1{
  font-size:18px;
  margin:0;
}
main{
  max-width:1100px;
  margin:18px auto 36px;
  padding:0 16px;
  display:grid;
  gap:16px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  box-shadow:0 4px 16px rgba(15,23,42,0.04);
}
.grid{
  display:grid;
  gap:12px;
}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
label{
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}
input,select,button,textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:14px;
  font-family:inherit;
  background:#fff;
}
textarea{resize:vertical;min-height:72px}
button{
  cursor:pointer;
  transition:all .2s ease;
}
button:active{transform:scale(.98)}
.btn{
  background:var(--accent);
  color:#fff;
  border:none;
}
.btn.secondary{
  background:#fff;
  color:var(--text);
  border:1px solid var(--border);
}
.btn.ghost{
  background:transparent;
  border:1px dashed var(--border);
  color:var(--muted);
}
.btn.danger{
  background:var(--danger);
  border:none;
  color:#fff;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.segmented{
  display:flex;
  gap:6px;
  background:#f3f4f6;
  padding:4px;
  border-radius:999px;
}
.segmented button{
  border:none;
  padding:8px 14px;
  border-radius:999px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
}
.segmented button.active{
  background:#fff;
  color:var(--text);
  box-shadow:0 1px 6px rgba(15,23,42,0.12);
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  background:var(--accent-soft);
  color:var(--accent);
}
.helper{color:var(--muted);font-size:12px}
.schedule-wrapper{
  overflow:auto;
  border-radius:12px;
  border:1px solid var(--border);
}
.schedule{
  min-width:680px;
  border-collapse:collapse;
  width:100%;
  font-size:13px;
}
.schedule th,.schedule td{
  border-bottom:1px solid var(--border);
  padding:10px;
  text-align:center;
  white-space:nowrap;
}
.schedule th{
  background:#f8fafc;
  color:var(--muted);
  font-weight:600;
  position:sticky;
  top:0;
  z-index:2;
}
.schedule td.task-cell{
  text-align:left;
  min-width:140px;
  position:sticky;
  left:0;
  background:#fff;
  z-index:1;
}
.task-pill{
  background:var(--accent-soft);
  color:var(--accent);
  padding:6px 10px;
  border-radius:999px;
  display:inline-block;
  font-size:12px;
}
.timeline-cell{
  min-width:48px;
  height:42px;
}
.timeline-cell.active{
  background:rgba(37,99,235,0.15);
}
.timeline-cell.today{
  outline:2px solid rgba(37,99,235,0.35);
  outline-offset:-2px;
}
.task-list{
  display:grid;
  gap:10px;
}
.task-item{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  display:grid;
  gap:8px;
}
.task-item header{
  position:static;
  border:none;
  background:transparent;
}
.task-item h3{margin:0;font-size:15px}
.task-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
.task-actions{display:flex;gap:8px;flex-wrap:wrap}
.note{background:#fef9c3;color:#92400e;border-radius:10px;padding:10px;font-size:12px}
@media (max-width:860px){
  .grid.cols-3{grid-template-columns:1fr}
}
@media (max-width:720px){
  .grid.cols-2{grid-template-columns:1fr}
  header .inner{flex-direction:column;align-items:flex-start}
}
@media (orientation:landscape){
  body{font-size:15px}
  .schedule{min-width:900px}
  .timeline-cell{min-width:60px}
}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div>
      <h1>工程表（モバイル対応）</h1>
      <div class="helper">2週間 / 1ヵ月の工程をワンタップで切り替え</div>
    </div>
    <div class="segmented" role="tablist" aria-label="表示切替">
      <button type="button" class="active" data-range="14">2週間</button>
      <button type="button" data-range="30">1ヵ月</button>
    </div>
  </div>
</header>

<main>
  <section class="card grid cols-2">
    <div class="grid">
      <div class="row" style="justify-content:space-between;gap:12px">
        <div>
          <div class="badge">📅 表示開始日</div>
          <div class="helper">携帯の縦横変更で自動最適化</div>
        </div>
        <button class="btn secondary" id="todayBtn">今日に戻す</button>
      </div>
      <div>
        <label for="startDate">開始日</label>
        <input type="date" id="startDate" />
      </div>
      <div class="note">入力はフォーム → 保存でOK。タスクをタップすると編集できます。</div>
    </div>

    <div class="grid">
      <div>
        <label for="taskName">タスク名</label>
        <input id="taskName" placeholder="例）基礎工事" />
      </div>
      <div class="grid cols-2">
        <div>
          <label for="taskStart">開始日</label>
          <input type="date" id="taskStart" />
        </div>
        <div>
          <label for="taskEnd">終了日</label>
          <input type="date" id="taskEnd" />
        </div>
      </div>
      <div>
        <label for="taskNote">メモ</label>
        <textarea id="taskNote" placeholder="例）資材搬入は朝8時"></textarea>
      </div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn ghost" id="cancelEdit" style="display:none">編集をキャンセル</button>
        <button class="btn" id="saveTask">保存</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="badge">🗓️ 工程表示</div>
        <div class="helper" id="rangeLabel"></div>
      </div>
      <div class="row">
        <button class="btn secondary" id="exportBtn">CSV出力</button>
        <button class="btn danger" id="resetBtn">全削除</button>
      </div>
    </div>
    <div class="schedule-wrapper" style="margin-top:12px">
      <table class="schedule" id="scheduleTable" aria-label="工程表"></table>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="badge">✅ タスク一覧</div>
        <div class="helper">ドラッグ不要、タップで編集</div>
      </div>
      <div class="helper" id="taskCount"></div>
    </div>
    <div class="task-list" id="taskList" style="margin-top:12px"></div>
  </section>
</main>

<script>
const state = {
  range: 14,
  tasks: [],
  editId: null,
};

const elements = {
  startDate: document.getElementById('startDate'),
  taskName: document.getElementById('taskName'),
  taskStart: document.getElementById('taskStart'),
  taskEnd: document.getElementById('taskEnd'),
  taskNote: document.getElementById('taskNote'),
  scheduleTable: document.getElementById('scheduleTable'),
  rangeLabel: document.getElementById('rangeLabel'),
  taskList: document.getElementById('taskList'),
  taskCount: document.getElementById('taskCount'),
  cancelEdit: document.getElementById('cancelEdit'),
};

const pad = (n) => String(n).padStart(2, '0');
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate = (value) => value ? new Date(`${value}T00:00:00`) : null;
const storageKey = 'scheduleTasksV1';

const loadTasks = () => {
  const raw = localStorage.getItem(storageKey);
  state.tasks = raw ? JSON.parse(raw) : [];
};
const saveTasks = () => {
  localStorage.setItem(storageKey, JSON.stringify(state.tasks));
};

const updateRangeLabel = () => {
  const start = parseDate(elements.startDate.value);
  if (!start) return;
  const end = new Date(start);
  end.setDate(end.getDate() + state.range - 1);
  elements.rangeLabel.textContent = `${elements.startDate.value} 〜 ${toDateStr(end)}（${state.range}日間）`;
};

const renderTable = () => {
  const start = parseDate(elements.startDate.value);
  if (!start) return;
  const days = Array.from({ length: state.range }, (_, i) => {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    return d;
  });
  const todayStr = toDateStr(new Date());

  const headerRow = `<tr><th>タスク</th>${days.map(d => `<th>${pad(d.getMonth()+1)}/${pad(d.getDate())}</th>`).join('')}</tr>`;

  const rows = state.tasks.map(task => {
    const startDate = parseDate(task.start);
    const endDate = parseDate(task.end);
    const cells = days.map(d => {
      const dStr = toDateStr(d);
      const isActive = startDate && endDate && d >= startDate && d <= endDate;
      const isToday = dStr === todayStr;
      const classes = [
        'timeline-cell',
        isActive ? 'active' : '',
        isToday ? 'today' : ''
      ].filter(Boolean).join(' ');
      return `<td class="${classes}"></td>`;
    }).join('');
    return `<tr><td class="task-cell"><span class="task-pill">${task.name}</span></td>${cells}</tr>`;
  }).join('');

  elements.scheduleTable.innerHTML = headerRow + (rows || `<tr><td class="task-cell" colspan="${state.range + 1}">タスクがまだありません。</td></tr>`);
  updateRangeLabel();
};

const renderTaskList = () => {
  elements.taskList.innerHTML = '';
  state.tasks.forEach(task => {
    const item = document.createElement('div');
    item.className = 'task-item';
    item.innerHTML = `
      <header>
        <h3>${task.name}</h3>
      </header>
      <div class="task-meta">
        <span>期間: ${task.start} 〜 ${task.end}</span>
        <span>更新: ${task.updatedAt}</span>
      </div>
      <div>${task.note ? task.note : '<span class="helper">メモなし</span>'}</div>
      <div class="task-actions">
        <button class="btn secondary" data-action="edit">編集</button>
        <button class="btn danger" data-action="delete">削除</button>
      </div>
    `;
    item.querySelector('[data-action="edit"]').addEventListener('click', () => startEditTask(task.id));
    item.querySelector('[data-action="delete"]').addEventListener('click', () => deleteTask(task.id));
    elements.taskList.appendChild(item);
  });
  elements.taskCount.textContent = `${state.tasks.length} 件`;
};

const clearForm = () => {
  elements.taskName.value = '';
  elements.taskStart.value = '';
  elements.taskEnd.value = '';
  elements.taskNote.value = '';
};

const startEditTask = (id) => {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  state.editId = id;
  elements.taskName.value = task.name;
  elements.taskStart.value = task.start;
  elements.taskEnd.value = task.end;
  elements.taskNote.value = task.note;
  elements.cancelEdit.style.display = 'inline-flex';
  elements.taskName.focus();
};

const finishEdit = () => {
  state.editId = null;
  elements.cancelEdit.style.display = 'none';
  clearForm();
};

const deleteTask = (id) => {
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveTasks();
  renderAll();
};

const renderAll = () => {
  renderTable();
  renderTaskList();
};

const validateTask = () => {
  if (!elements.taskName.value.trim()) {
    alert('タスク名を入力してください');
    return false;
  }
  if (!elements.taskStart.value || !elements.taskEnd.value) {
    alert('開始日と終了日を入力してください');
    return false;
  }
  const start = parseDate(elements.taskStart.value);
  const end = parseDate(elements.taskEnd.value);
  if (end < start) {
    alert('終了日は開始日以降にしてください');
    return false;
  }
  return true;
};

const saveTask = () => {
  if (!validateTask()) return;
  const now = new Date();
  const taskData = {
    id: state.editId ?? crypto.randomUUID(),
    name: elements.taskName.value.trim(),
    start: elements.taskStart.value,
    end: elements.taskEnd.value,
    note: elements.taskNote.value.trim(),
    updatedAt: `${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`
  };
  if (state.editId) {
    state.tasks = state.tasks.map(task => task.id === state.editId ? taskData : task);
    finishEdit();
  } else {
    state.tasks.unshift(taskData);
    clearForm();
  }
  saveTasks();
  renderAll();
};

const exportCSV = () => {
  const header = ['タスク名','開始日','終了日','メモ'];
  const rows = state.tasks.map(task => [
    `"${task.name.replace(/"/g, '""')}"`,
    task.start,
    task.end,
    `"${(task.note || '').replace(/"/g, '""')}"`
  ].join(','));
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'schedule.csv';
  link.click();
  URL.revokeObjectURL(link.href);
};

const resetAll = () => {
  if (!confirm('すべてのタスクを削除します。よろしいですか？')) return;
  state.tasks = [];
  saveTasks();
  renderAll();
};

const init = () => {
  const today = new Date();
  elements.startDate.value = toDateStr(today);
  elements.taskStart.value = toDateStr(today);
  elements.taskEnd.value = toDateStr(today);
  loadTasks();
  renderAll();
};

document.querySelectorAll('.segmented button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.segmented button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.range = Number(btn.dataset.range);
    renderTable();
  });
});

elements.startDate.addEventListener('change', renderTable);

document.getElementById('todayBtn').addEventListener('click', () => {
  elements.startDate.value = toDateStr(new Date());
  renderTable();
});

document.getElementById('saveTask').addEventListener('click', saveTask);

elements.cancelEdit.addEventListener('click', finishEdit);

document.getElementById('exportBtn').addEventListener('click', exportCSV);

document.getElementById('resetBtn').addEventListener('click', resetAll);

init();
</script>
</body>
</html>
