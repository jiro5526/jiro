<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>工程表アプリ</title>
<style>
:root{
  --bg:#f7f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--border:#e5e7eb;
  --good:#16a34a;--warn:#f97316;--danger:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:14px 18px;z-index:5}
header h1{margin:0;font-size:18px}
main{max-width:980px;margin:16px auto;padding:0 16px 40px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.section{padding:16px}
.grid{display:grid;gap:12px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
input,select,button,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:14px}
textarea{min-height:70px;resize:vertical}
button{cursor:pointer}
.btn{background:var(--accent);color:#fff;border:none}
.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{display:flex;gap:10px;justify-content:flex-end}
.badge{padding:4px 8px;border-radius:999px;font-size:12px}
.badge.done{background:rgba(22,163,74,.12);color:var(--good)}
.badge.todo{background:rgba(249,115,22,.14);color:var(--warn)}
.badge.late{background:rgba(239,68,68,.12);color:var(--danger)}
.step{display:grid;gap:8px;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}
.step h3{margin:0;font-size:15px}
.step .meta{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.step .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.progress{display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;height:8px;background:#eef2ff;border-radius:999px;overflow:hidden}
.progress-bar span{display:block;height:100%;background:var(--accent)}
.empty{padding:20px;text-align:center;color:var(--muted)}
@media (max-width:720px){
  .grid.cols-2,.grid.cols-3{grid-template-columns:1fr}
  header{padding:12px 14px}
}
</style>
</head>
<body>
<header><h1>工程表アプリ</h1></header>

<main>
  <section class="card section">
    <div class="grid cols-2">
      <div>
        <label>プロジェクト名</label>
        <input id="projectName" placeholder="例）新店舗オープン準備">
      </div>
      <div>
        <label>今日の日付</label>
        <input id="today" type="date">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="progress" style="flex:1">
        <strong>進捗：</strong>
        <div class="progress-bar"><span id="progressBar" style="width:0%"></span></div>
        <span id="progressText">0%</span>
      </div>
      <div class="badge" id="progressBadge">未着手</div>
    </div>
  </section>

  <section class="card section">
    <h2 style="margin:0 0 12px;font-size:16px">工程を追加</h2>
    <div class="grid cols-3">
      <div>
        <label>工程名</label>
        <input id="taskName" placeholder="例）資材の発注">
      </div>
      <div>
        <label>担当者</label>
        <input id="assignee" placeholder="例）佐藤">
      </div>
      <div>
        <label>優先度</label>
        <select id="priority">
          <option value="high">高</option>
          <option value="medium" selected>中</option>
          <option value="low">低</option>
        </select>
      </div>
    </div>
    <div class="grid cols-3" style="margin-top:10px">
      <div>
        <label>開始日</label>
        <input id="startDate" type="date">
      </div>
      <div>
        <label>終了日</label>
        <input id="endDate" type="date">
      </div>
      <div>
        <label>メモ</label>
        <textarea id="note" placeholder="補足があれば入力"></textarea>
      </div>
    </div>
    <div class="right" style="margin-top:12px">
      <button class="btn secondary" id="clearForm">クリア</button>
      <button class="btn" id="addTask">追加</button>
    </div>
  </section>

  <section class="card section">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <label>表示</label>
        <select id="filter">
          <option value="all">すべて</option>
          <option value="todo">未完了</option>
          <option value="done">完了</option>
        </select>
      </div>
      <div class="row">
        <label>検索</label>
        <input id="search" placeholder="工程名・担当者で検索">
      </div>
    </div>
    <div id="taskList" style="margin-top:12px"></div>
  </section>
</main>

<script>
const STORAGE_KEY = "simple_schedule_app_v1";
const $ = (id) => document.getElementById(id);

function readStorage(){
  const raw = localStorage.getItem(STORAGE_KEY);
  try{
    return raw ? JSON.parse(raw) : { project:"", tasks:[] };
  }catch{
    return { project:"", tasks:[] };
  }
}

function writeStorage(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function formatDate(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  if(Number.isNaN(d.getTime())) return dateStr;
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function calcStatus(task, todayStr){
  if(task.done) return "done";
  if(!task.endDate || !todayStr) return "todo";
  return task.endDate < todayStr ? "late" : "todo";
}

function priorityLabel(level){
  return { high:"高", medium:"中", low:"低" }[level] || "-";
}

function render(){
  const data = readStorage();
  $("projectName").value = data.project || "";

  const today = $("today").value;
  const list = $("taskList");
  const filter = $("filter").value;
  const search = $("search").value.trim().toLowerCase();

  const filtered = data.tasks.filter(task => {
    const status = task.done ? "done" : "todo";
    if(filter !== "all" && status !== filter) return false;
    if(search){
      const hay = `${task.name} ${task.assignee}`.toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });

  list.innerHTML = "";
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">工程がありません。上のフォームから追加してください。</div>';
  }

  filtered.forEach(task => {
    const status = calcStatus(task, today);
    const wrapper = document.createElement("div");
    wrapper.className = "step";
    const badgeClass = status === "done" ? "done" : (status === "late" ? "late" : "todo");
    const badgeText = status === "done" ? "完了" : (status === "late" ? "遅延" : "未完了");

    wrapper.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <h3>${task.name}</h3>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="meta">
        <div>担当：${task.assignee || "未設定"} / 優先度：${priorityLabel(task.priority)}</div>
        <div>期間：${formatDate(task.startDate)} 〜 ${formatDate(task.endDate)}</div>
        ${task.note ? `<div>メモ：${task.note}</div>` : ""}
      </div>
    `;

    const actions = document.createElement("div");
    actions.className = "actions";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.addEventListener("change", () => {
      task.done = checkbox.checked;
      updateTask(task);
    });

    const label = document.createElement("span");
    label.textContent = "完了";

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "btn secondary";
    deleteBtn.textContent = "削除";
    deleteBtn.addEventListener("click", () => removeTask(task.id));

    actions.appendChild(checkbox);
    actions.appendChild(label);
    actions.appendChild(deleteBtn);

    wrapper.appendChild(actions);
    list.appendChild(wrapper);
  });

  updateProgress(data.tasks);
}

function updateProgress(tasks){
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const percent = total === 0 ? 0 : Math.round((done / total) * 100);
  $("progressBar").style.width = `${percent}%`;
  $("progressText").textContent = `${percent}%`;
  const badge = $("progressBadge");
  if(percent === 100 && total > 0){
    badge.textContent = "完了";
    badge.className = "badge done";
  }else if(percent === 0){
    badge.textContent = "未着手";
    badge.className = "badge todo";
  }else{
    badge.textContent = "進行中";
    badge.className = "badge";
  }
}

function updateTask(task){
  const data = readStorage();
  const idx = data.tasks.findIndex(t => t.id === task.id);
  if(idx >= 0){
    data.tasks[idx] = task;
    writeStorage(data);
  }
  render();
}

function removeTask(id){
  const data = readStorage();
  data.tasks = data.tasks.filter(t => t.id !== id);
  writeStorage(data);
  render();
}

function addTask(){
  const name = $("taskName").value.trim();
  if(!name){
    alert("工程名を入力してください");
    return;
  }
  const startDate = $("startDate").value;
  const endDate = $("endDate").value;
  if(startDate && endDate && endDate < startDate){
    alert("終了日は開始日以降にしてください");
    return;
  }
  const task = {
    id: crypto.randomUUID(),
    name,
    assignee: $("assignee").value.trim(),
    priority: $("priority").value,
    startDate,
    endDate,
    note: $("note").value.trim(),
    done: false
  };
  const data = readStorage();
  data.tasks.unshift(task);
  data.project = $("projectName").value.trim();
  writeStorage(data);
  clearForm();
  render();
}

function clearForm(){
  ["taskName","assignee","startDate","endDate","note"].forEach(id => $(id).value = "");
  $("priority").value = "medium";
}

function init(){
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  $("today").value = todayStr;

  const data = readStorage();
  $("projectName").value = data.project || "";

  $("addTask").addEventListener("click", addTask);
  $("clearForm").addEventListener("click", clearForm);
  $("filter").addEventListener("change", render);
  $("search").addEventListener("input", render);
  $("projectName").addEventListener("change", () => {
    const current = readStorage();
    current.project = $("projectName").value.trim();
    writeStorage(current);
  });
  $("today").addEventListener("change", render);

  render();
}

init();
</script>
</body>
</html>
