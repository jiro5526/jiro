<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1190" viewBox="0 0 750 1190" role="img" aria-label="05-workflow.svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050d1b"/><stop offset=".45" stop-color="#092047"/><stop offset="1" stop-color="#050b18"/></linearGradient>
  <radialGradient id="halo" cx="62%" cy="18%" r="70%"><stop offset="0" stop-color="#1e7fff" stop-opacity=".42"/><stop offset=".45" stop-color="#12416e" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="5" dy="6" stdDeviation="3" flood-color="#000" flood-opacity=".72"/></filter>
  <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#2a83ff" flood-opacity=".72"/></filter>
  <pattern id="grid" width="72" height="86" patternUnits="userSpaceOnUse"><path d="M0 0H72M0 0V86" stroke="#5f9bd9" stroke-opacity=".10"/><path d="M-20 86L72 -20" stroke="#5f9bd9" stroke-opacity=".06"/></pattern>
  <filter id="rough5"><feTurbulence baseFrequency=".9" numOctaves="2" seed="5" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer></filter>
</defs><style>
  .jp{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',system-ui,sans-serif;letter-spacing:-.02em}
  .display{font-weight:900;paint-order:stroke;stroke:#030711;stroke-width:8px;stroke-linejoin:round}
  .h1{font-size:56px;font-weight:900}.h2{font-size:42px;font-weight:900}.h3{font-size:30px;font-weight:800}.body{font-size:24px;font-weight:600}.small{font-size:17px;font-weight:500}
  .white{fill:#f6f7f0}.yellow{fill:#efc41f}.muted{fill:#b2becd}.ink{fill:#0b121e}.paper{fill:#f3f1e7}.blue{fill:#2a83ff}
  .shadow{filter:url(#shadow)}.glow{filter:url(#glow)}
</style><rect width="750" height="1190" fill="url(#bg)"/><rect width="750" height="1190" fill="url(#halo)"/><rect width="750" height="1190" fill="url(#grid)"/><rect width="750" height="1190" fill="#000" opacity=".08" filter="url(#rough5)"/><text x="50" y="122" class="jp h1 white shadow" text-anchor="start"><tspan x="50" dy="0">当日の流れ</tspan></text><text x="50" y="188" class="jp h1 yellow shadow" text-anchor="start" font-size="48"><tspan x="50" dy="0">90分で地図を作る</tspan></text><rect x="92" y="250" width="586" height="112" rx="24" fill="#0c1420" opacity=".86" stroke="#5082c8" stroke-opacity=".65" stroke-width="2"/><text x="120" y="302" class="jp h3 yellow" text-anchor="start" font-size="30"><tspan x="120" dy="0">STEP 1</tspan></text><text x="120" y="344" class="jp body white" text-anchor="start" font-size="25"><tspan x="120" dy="0">現場経験を資産として言語化</tspan></text><path d="M375 368v28" stroke="#efc41f" stroke-width="5"/><path d="M363 395h24l-12 21z" fill="#efc41f"/><rect x="92" y="418" width="586" height="112" rx="24" fill="#0c1420" opacity=".86" stroke="#5082c8" stroke-opacity=".65" stroke-width="2"/><text x="120" y="470" class="jp h3 yellow" text-anchor="start" font-size="30"><tspan x="120" dy="0">STEP 2</tspan></text><text x="120" y="512" class="jp body white" text-anchor="start" font-size="25"><tspan x="120" dy="0">AIに渡す素材とNG入力を整理</tspan></text><path d="M375 536v28" stroke="#efc41f" stroke-width="5"/><path d="M363 563h24l-12 21z" fill="#efc41f"/><rect x="92" y="586" width="586" height="112" rx="24" fill="#0c1420" opacity=".86" stroke="#5082c8" stroke-opacity=".65" stroke-width="2"/><text x="120" y="638" class="jp h3 yellow" text-anchor="start" font-size="30"><tspan x="120" dy="0">STEP 3</tspan></text><text x="120" y="680" class="jp body white" text-anchor="start" font-size="25"><tspan x="120" dy="0">売れるテーマを3つに絞る</tspan></text><path d="M375 704v28" stroke="#efc41f" stroke-width="5"/><path d="M363 731h24l-12 21z" fill="#efc41f"/><rect x="92" y="754" width="586" height="112" rx="24" fill="#0c1420" opacity=".86" stroke="#5082c8" stroke-opacity=".65" stroke-width="2"/><text x="120" y="806" class="jp h3 yellow" text-anchor="start" font-size="30"><tspan x="120" dy="0">STEP 4</tspan></text><text x="120" y="848" class="jp body white" text-anchor="start" font-size="25"><tspan x="120" dy="0">LP・動画・LINE導線の設計</tspan></text><path d="M375 872v28" stroke="#efc41f" stroke-width="5"/><path d="M363 899h24l-12 21z" fill="#efc41f"/><rect x="92" y="922" width="586" height="112" rx="24" fill="#0c1420" opacity=".86" stroke="#5082c8" stroke-opacity=".65" stroke-width="2"/><text x="120" y="974" class="jp h3 yellow" text-anchor="start" font-size="30"><tspan x="120" dy="0">STEP 5</tspan></text><text x="120" y="1016" class="jp body white" text-anchor="start" font-size="25"><tspan x="120" dy="0">7日間の実践プランを作成</tspan></text><g id="cta-zone" class="jp"><rect x="70" y="1030" width="610" height="92" rx="34" fill="#efc41f" stroke="#fff29c" stroke-width="4"/><text x="375" y="1088" text-anchor="middle" font-size="32" font-weight="900" fill="#0b121e">LIVEの席を確保</text><text x="375" y="1152" text-anchor="middle" font-size="17" fill="#b2becd">※後からHTMLボタンを重ねやすい余白を確保</text></g></svg>