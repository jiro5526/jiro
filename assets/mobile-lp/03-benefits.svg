<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1120" viewBox="0 0 750 1120" role="img" aria-label="03-benefits.svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050d1b"/><stop offset=".45" stop-color="#092047"/><stop offset="1" stop-color="#050b18"/></linearGradient>
  <radialGradient id="halo" cx="62%" cy="18%" r="70%"><stop offset="0" stop-color="#1e7fff" stop-opacity=".42"/><stop offset=".45" stop-color="#12416e" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="5" dy="6" stdDeviation="3" flood-color="#000" flood-opacity=".72"/></filter>
  <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#2a83ff" flood-opacity=".72"/></filter>
  <pattern id="grid" width="72" height="86" patternUnits="userSpaceOnUse"><path d="M0 0H72M0 0V86" stroke="#5f9bd9" stroke-opacity=".10"/><path d="M-20 86L72 -20" stroke="#5f9bd9" stroke-opacity=".06"/></pattern>
  <filter id="rough3"><feTurbulence baseFrequency=".9" numOctaves="2" seed="3" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer></filter>
</defs><style>
  .jp{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',system-ui,sans-serif;letter-spacing:-.02em}
  .display{font-weight:900;paint-order:stroke;stroke:#030711;stroke-width:8px;stroke-linejoin:round}
  .h1{font-size:56px;font-weight:900}.h2{font-size:42px;font-weight:900}.h3{font-size:30px;font-weight:800}.body{font-size:24px;font-weight:600}.small{font-size:17px;font-weight:500}
  .white{fill:#f6f7f0}.yellow{fill:#efc41f}.muted{fill:#b2becd}.ink{fill:#0b121e}.paper{fill:#f3f1e7}.blue{fill:#2a83ff}
  .shadow{filter:url(#shadow)}.glow{filter:url(#glow)}
</style><rect width="750" height="1120" fill="url(#bg)"/><rect width="750" height="1120" fill="url(#halo)"/><rect width="750" height="1120" fill="url(#grid)"/><rect width="750" height="1120" fill="#000" opacity=".08" filter="url(#rough3)"/><text x="50" y="124" class="jp h1 white shadow" text-anchor="start"><tspan x="50" dy="0">このLIVEで</tspan></text><text x="50" y="190" class="jp h1 yellow shadow" text-anchor="start"><tspan x="50" dy="0">手に入るもの</tspan></text><g><rect x="48" y="250" width="654" height="118" rx="24" fill="#000" opacity="0.5"/><rect x="48" y="250" width="654" height="118" rx="24" fill="none" stroke="#4178be" stroke-opacity=".55" stroke-width="2"/><text x="82" y="322" class="jp h2 yellow" text-anchor="start" font-size="42"><tspan x="82" dy="0">01</tspan></text><text x="158" y="322" class="jp body white" text-anchor="start" font-size="26"><tspan x="158" dy="0">経験を棚卸しする質問リスト</tspan></text></g><g><rect x="48" y="394" width="654" height="118" rx="24" fill="#000" opacity="0.5"/><rect x="48" y="394" width="654" height="118" rx="24" fill="none" stroke="#4178be" stroke-opacity=".55" stroke-width="2"/><text x="82" y="466" class="jp h2 yellow" text-anchor="start" font-size="42"><tspan x="82" dy="0">02</tspan></text><text x="158" y="466" class="jp body white" text-anchor="start" font-size="26"><tspan x="158" dy="0">AIに渡す現場メモの作り方</tspan></text></g><g><rect x="48" y="538" width="654" height="118" rx="24" fill="#000" opacity="0.5"/><rect x="48" y="538" width="654" height="118" rx="24" fill="none" stroke="#4178be" stroke-opacity=".55" stroke-width="2"/><text x="82" y="610" class="jp h2 yellow" text-anchor="start" font-size="42"><tspan x="82" dy="0">03</tspan></text><text x="158" y="610" class="jp body white" text-anchor="start" font-size="26"><tspan x="158" dy="0">商品化できるテーマの見つけ方</tspan></text></g><g><rect x="48" y="682" width="654" height="118" rx="24" fill="#000" opacity="0.5"/><rect x="48" y="682" width="654" height="118" rx="24" fill="none" stroke="#4178be" stroke-opacity=".55" stroke-width="2"/><text x="82" y="754" class="jp h2 yellow" text-anchor="start" font-size="42"><tspan x="82" dy="0">04</tspan></text><text x="158" y="754" class="jp body white" text-anchor="start" font-size="26"><tspan x="158" dy="0">顔出しなしでも信頼を作るLP骨子</tspan></text></g><g><rect x="48" y="826" width="654" height="118" rx="24" fill="#000" opacity="0.5"/><rect x="48" y="826" width="654" height="118" rx="24" fill="none" stroke="#4178be" stroke-opacity=".55" stroke-width="2"/><text x="82" y="898" class="jp h2 yellow" text-anchor="start" font-size="42"><tspan x="82" dy="0">05</tspan></text><text x="158" y="898" class="jp body white" text-anchor="start" font-size="26"><tspan x="158" dy="0">今日から試せる無料ツール導線</tspan></text></g><g id="cta-zone" class="jp"><rect x="70" y="950" width="610" height="92" rx="34" fill="#efc41f" stroke="#fff29c" stroke-width="4"/><text x="375" y="1008" text-anchor="middle" font-size="32" font-weight="900" fill="#0b121e">席だけ先に確保する</text><text x="375" y="1072" text-anchor="middle" font-size="17" fill="#b2becd">※後からHTMLボタンを重ねやすい余白を確保</text></g></svg>