<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1080" viewBox="0 0 750 1080" role="img" aria-label="04-recommendation.svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050d1b"/><stop offset=".45" stop-color="#092047"/><stop offset="1" stop-color="#050b18"/></linearGradient>
  <radialGradient id="halo" cx="62%" cy="18%" r="70%"><stop offset="0" stop-color="#1e7fff" stop-opacity=".42"/><stop offset=".45" stop-color="#12416e" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="5" dy="6" stdDeviation="3" flood-color="#000" flood-opacity=".72"/></filter>
  <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#2a83ff" flood-opacity=".72"/></filter>
  <pattern id="grid" width="72" height="86" patternUnits="userSpaceOnUse"><path d="M0 0H72M0 0V86" stroke="#5f9bd9" stroke-opacity=".10"/><path d="M-20 86L72 -20" stroke="#5f9bd9" stroke-opacity=".06"/></pattern>
  <filter id="rough4"><feTurbulence baseFrequency=".9" numOctaves="2" seed="4" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer></filter>
</defs><style>
  .jp{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',system-ui,sans-serif;letter-spacing:-.02em}
  .display{font-weight:900;paint-order:stroke;stroke:#030711;stroke-width:8px;stroke-linejoin:round}
  .h1{font-size:56px;font-weight:900}.h2{font-size:42px;font-weight:900}.h3{font-size:30px;font-weight:800}.body{font-size:24px;font-weight:600}.small{font-size:17px;font-weight:500}
  .white{fill:#f6f7f0}.yellow{fill:#efc41f}.muted{fill:#b2becd}.ink{fill:#0b121e}.paper{fill:#f3f1e7}.blue{fill:#2a83ff}
  .shadow{filter:url(#shadow)}.glow{filter:url(#glow)}
</style><rect width="750" height="1080" fill="url(#bg)"/><rect width="750" height="1080" fill="url(#halo)"/><rect width="750" height="1080" fill="url(#grid)"/><rect width="750" height="1080" fill="#000" opacity=".08" filter="url(#rough4)"/><text x="50" y="122" class="jp h1 white shadow" text-anchor="start"><tspan x="50" dy="0">こんな方に</tspan></text><text x="50" y="188" class="jp h1 yellow shadow" text-anchor="start"><tspan x="50" dy="0">おすすめです</tspan></text><rect x="55" y="245" width="640" height="100" rx="22" fill="#f4f6ee" opacity="0.94"/><circle cx="105" cy="295" r="23" fill="#efc41f"/><path d="M94 296l11 12 16-25" stroke="#0b121e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="307" class="jp body ink" text-anchor="start" font-size="25"><tspan x="150" dy="0">長年の現場経験を次の収入に変えたい</tspan></text><rect x="55" y="371" width="640" height="100" rx="22" fill="#f4f6ee" opacity="0.94"/><circle cx="105" cy="421" r="23" fill="#efc41f"/><path d="M94 422l11 12 16-25" stroke="#0b121e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="433" class="jp body ink" text-anchor="start" font-size="25"><tspan x="150" dy="0">AIに興味はあるが、何から始めるか迷う</tspan></text><rect x="55" y="497" width="640" height="100" rx="22" fill="#f4f6ee" opacity="0.94"/><circle cx="105" cy="547" r="23" fill="#efc41f"/><path d="M94 548l11 12 16-25" stroke="#0b121e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="559" class="jp body ink" text-anchor="start" font-size="25"><tspan x="150" dy="0">若手に任せきりのDXに不安がある</tspan></text><rect x="55" y="623" width="640" height="100" rx="22" fill="#f4f6ee" opacity="0.94"/><circle cx="105" cy="673" r="23" fill="#efc41f"/><path d="M94 674l11 12 16-25" stroke="#0b121e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="685" class="jp body ink" text-anchor="start" font-size="25"><tspan x="150" dy="0">日誌・資料・写真が眠ったままになっている</tspan></text><rect x="55" y="749" width="640" height="100" rx="22" fill="#f4f6ee" opacity="0.94"/><circle cx="105" cy="799" r="23" fill="#efc41f"/><path d="M94 800l11 12 16-25" stroke="#0b121e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="811" class="jp body ink" text-anchor="start" font-size="25"><tspan x="150" dy="0">自分の言葉で発信する型がほしい</tspan></text><text x="375" y="950" class="jp body muted" text-anchor="middle">派手な煽りではなく、実務に落ちる内容です。</text></svg>