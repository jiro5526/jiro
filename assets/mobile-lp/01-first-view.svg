<text x="50" y="690" class="jp h3 white shadow" text-anchor="start" font-size="31"><tspan x="50" dy="0">深夜に目頭を熱くした理由</tspan></text>
<rect x="42" y="760" width="666" height="170" rx="28" fill="#f4f6ee" opacity="0.94"/><text x="72" y="832" class="jp h2 ink" text-anchor="start" font-size="45"><tspan x="72" dy="0">無料LIVE講座</tspan></text><text x="72" y="890" class="jp body ink" text-anchor="start" font-size="25"><tspan x="72" dy="0">経験をAIで“売れる知識”に変える90分</tspan></text><g id="cta-zone" class="jp"><rect x="70" y="990" width="610" height="92" rx="34" fill="#efc41f" stroke="#fff29c" stroke-width="4"/><text x="375" y="1048" text-anchor="middle" font-size="32" font-weight="900" fill="#0b121e">無料LIVEを予約する</text><text x="375" y="1112" text-anchor="middle" font-size="17" fill="#b2becd">※後からHTMLボタンを重ねやすい余白を確保</text></g></svg>