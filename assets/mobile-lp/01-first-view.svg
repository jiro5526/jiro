<text x="44" y="235" class="jp display white shadow" text-anchor="start" font-size="88"><tspan x="44" dy="0">AIが</tspan></text><text x="44" y="340" class="jp display yellow shadow" text-anchor="start" font-size="74"><tspan x="44" dy="0">俺の12年を</tspan></text><text x="44" y="442" class="jp display white shadow" text-anchor="start" font-size="74"><tspan x="44" dy="0">資産に変えた</tspan></text>
