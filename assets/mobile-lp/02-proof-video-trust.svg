<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1120" viewBox="0 0 750 1120" role="img" aria-label="02-proof-video-trust.svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050d1b"/><stop offset=".45" stop-color="#092047"/><stop offset="1" stop-color="#050b18"/></linearGradient>
  <radialGradient id="halo" cx="62%" cy="18%" r="70%"><stop offset="0" stop-color="#1e7fff" stop-opacity=".42"/><stop offset=".45" stop-color="#12416e" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="5" dy="6" stdDeviation="3" flood-color="#000" flood-opacity=".72"/></filter>
  <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#2a83ff" flood-opacity=".72"/></filter>
  <pattern id="grid" width="72" height="86" patternUnits="userSpaceOnUse"><path d="M0 0H72M0 0V86" stroke="#5f9bd9" stroke-opacity=".10"/><path d="M-20 86L72 -20" stroke="#5f9bd9" stroke-opacity=".06"/></pattern>
  <filter id="rough2"><feTurbulence baseFrequency=".9" numOctaves="2" seed="2" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer></filter>
</defs><style>
  .jp{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',system-ui,sans-serif;letter-spacing:-.02em}
  .display{font-weight:900;paint-order:stroke;stroke:#030711;stroke-width:8px;stroke-linejoin:round}
  .h1{font-size:56px;font-weight:900}.h2{font-size:42px;font-weight:900}.h3{font-size:30px;font-weight:800}.body{font-size:24px;font-weight:600}.small{font-size:17px;font-weight:500}
  .white{fill:#f6f7f0}.yellow{fill:#efc41f}.muted{fill:#b2becd}.ink{fill:#0b121e}.paper{fill:#f3f1e7}.blue{fill:#2a83ff}
  .shadow{filter:url(#shadow)}.glow{filter:url(#glow)}
</style><rect width="750" height="1120" fill="url(#bg)"/><rect width="750" height="1120" fill="url(#halo)"/><rect width="750" height="1120" fill="url(#grid)"/><rect width="750" height="1120" fill="#000" opacity=".08" filter="url(#rough2)"/><text x="50" y="122" class="jp h1 white shadow" text-anchor="start"><tspan x="50" dy="0">なぜ今、現場経験が</tspan></text><text x="50" y="188" class="jp h1 yellow shadow" text-anchor="start" font-size="48"><tspan x="50" dy="0">AI時代の武器になるのか</tspan></text><rect x="55" y="250" width="640" height="400" rx="30" fill="#080c12" opacity=".9" stroke="#82aad8" stroke-opacity=".65" stroke-width="3"/><rect x="88" y="292" width="574" height="316" fill="#0f233e" stroke="#4680d2" stroke-opacity=".6"/><polygon points="335,430 335,510 420,470" fill="#f5f5ee" opacity=".9"/><text x="375" y="636" class="jp small muted" text-anchor="middle">動画 / VSL を後から配置</text><rect x="50" y="735" width="650" height="92" rx="22" fill="#f4f6ee" opacity="0.94"/><text x="80" y="778" class="jp body ink" text-anchor="start" font-size="27"><tspan x="80" dy="0">12年分の判断</tspan></text><text x="80" y="813" class="jp small ink" text-anchor="start" font-size="17"><tspan x="80" dy="0">失敗回避・段取り・指導ノウハウはAIで整理できる</tspan></text><rect x="50" y="847" width="650" height="92" rx="22" fill="#f4f6ee" opacity="0.94"/><text x="80" y="890" class="jp body ink" text-anchor="start" font-size="27"><tspan x="80" dy="0">現場言語の強み</tspan></text><text x="80" y="925" class="jp small ink" text-anchor="start" font-size="17"><tspan x="80" dy="0">机上の一般論ではなく、一次情報として価値が出る</tspan></text><rect x="50" y="959" width="650" height="92" rx="22" fill="#f4f6ee" opacity="0.94"/><text x="80" y="1002" class="jp body ink" text-anchor="start" font-size="27"><tspan x="80" dy="0">実績の見せ方</tspan></text><text x="80" y="1037" class="jp small ink" text-anchor="start" font-size="17"><tspan x="80" dy="0">日誌・写真・チェックリストが信頼の証拠になる</tspan></text></svg>