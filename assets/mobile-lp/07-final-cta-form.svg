<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1220" viewBox="0 0 750 1220" role="img" aria-label="07-final-cta-form.svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050d1b"/><stop offset=".45" stop-color="#092047"/><stop offset="1" stop-color="#050b18"/></linearGradient>
  <radialGradient id="halo" cx="62%" cy="18%" r="70%"><stop offset="0" stop-color="#1e7fff" stop-opacity=".42"/><stop offset=".45" stop-color="#12416e" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="5" dy="6" stdDeviation="3" flood-color="#000" flood-opacity=".72"/></filter>
  <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#2a83ff" flood-opacity=".72"/></filter>
  <pattern id="grid" width="72" height="86" patternUnits="userSpaceOnUse"><path d="M0 0H72M0 0V86" stroke="#5f9bd9" stroke-opacity=".10"/><path d="M-20 86L72 -20" stroke="#5f9bd9" stroke-opacity=".06"/></pattern>
  <filter id="rough7"><feTurbulence baseFrequency=".9" numOctaves="2" seed="7" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer></filter>
</defs><style>
  .jp{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',system-ui,sans-serif;letter-spacing:-.02em}
  .display{font-weight:900;paint-order:stroke;stroke:#030711;stroke-width:8px;stroke-linejoin:round}
  .h1{font-size:56px;font-weight:900}.h2{font-size:42px;font-weight:900}.h3{font-size:30px;font-weight:800}.body{font-size:24px;font-weight:600}.small{font-size:17px;font-weight:500}
  .white{fill:#f6f7f0}.yellow{fill:#efc41f}.muted{fill:#b2becd}.ink{fill:#0b121e}.paper{fill:#f3f1e7}.blue{fill:#2a83ff}
  .shadow{filter:url(#shadow)}.glow{filter:url(#glow)}
</style><rect width="750" height="1220" fill="url(#bg)"/><rect width="750" height="1220" fill="url(#halo)"/><rect width="750" height="1220" fill="url(#grid)"/><rect width="750" height="1220" fill="#000" opacity=".08" filter="url(#rough7)"/><rect width="750" height="1220" fill="#000" opacity=".35"/><text x="50" y="128" class="jp h1 white shadow" text-anchor="start"><tspan x="50" dy="0">経験は、</tspan></text><text x="50" y="198" class="jp h1 yellow shadow" text-anchor="start" font-size="50"><tspan x="50" dy="0">まだ終わっていない。</tspan></text><text x="50" y="276" class="jp h3 white shadow" text-anchor="start" font-size="31"><tspan x="50" dy="0">AIを味方につけて、あなたの12年を</tspan><tspan x="50" dy="1.45em">次の資産に変えよう。</tspan></text><rect x="50" y="410" width="650" height="315" rx="28" fill="#f4f6ee" opacity="0.94"/><text x="375" y="475" class="jp h2 ink" text-anchor="middle">無料LIVE予約フォーム</text><rect x="92" y="520" width="566" height="44" rx="12" fill="#fff" stroke="#cdd2da" stroke-width="2"/><text x="112" y="549" class="jp small" fill="#646e7a">お名前</text><rect x="92" y="582" width="566" height="44" rx="12" fill="#fff" stroke="#cdd2da" stroke-width="2"/><text x="112" y="611" class="jp small" fill="#646e7a">メールアドレス</text><rect x="92" y="644" width="566" height="44" rx="12" fill="#fff" stroke="#cdd2da" stroke-width="2"/><text x="112" y="673" class="jp small" fill="#646e7a">参加希望日</text><g id="cta-zone" class="jp"><rect x="70" y="800" width="610" height="92" rx="34" fill="#efc41f" stroke="#fff29c" stroke-width="4"/><text x="375" y="858" text-anchor="middle" font-size="32" font-weight="900" fill="#0b121e">無料で参加する</text><text x="375" y="922" text-anchor="middle" font-size="17" fill="#b2becd">※後からHTMLボタンを重ねやすい余白を確保</text></g><text x="375" y="1015" class="jp body muted" text-anchor="middle">登録後、視聴URLをメールでお送りします。</text><text x="375" y="1060" class="jp body muted" text-anchor="middle">いつでも解除できます。</text><text x="375" y="1140" class="jp small muted" text-anchor="middle">プライバシーポリシー / 特商法リンク配置エリア</text></svg>