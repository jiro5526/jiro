</g><rect x="50" y="655" width="650" height="385" rx="30" fill="#f4f6ee" opacity="0.94"/><text x="80" y="750" class="jp h1 ink" text-anchor="start"><tspan x="80" dy="0">佐藤 誠</tspan></text><text x="80" y="795" class="jp body ink" text-anchor="start" font-size="25"><tspan x="80" dy="0">32年の現場監督 / DX研修講師</tspan></text><text x="80" y="870" class="jp body ink" text-anchor="start" font-size="24"><tspan x="80" dy="0">建設・製造の現場で安全、品質、工程管理に携わる。</tspan><tspan x="80" dy="1.45em">紙の日誌と属人化した判断をAIで整理し、</tspan><tspan x="80" dy="1.45em">若手育成と知識の商品化に転用する実践型プログラムを提供。</tspan></text><text x="375" y="1105" class="jp small muted" text-anchor="middle">※プロフィール・写真は差し替え前提の仮配置</text></svg>