  .shadow{filter:url(#shadow)}.glow{filter:url(#glow)}
</style><rect width="750" height="1180" fill="url(#bg)"/><rect width="750" height="1180" fill="url(#halo)"/><rect width="750" height="1180" fill="url(#grid)"/><rect width="750" height="1180" fill="#000" opacity=".08" filter="url(#rough6)"/><text x="50" y="122" class="jp h1 white shadow" text-anchor="start"><tspan x="50" dy="0">登壇者</tspan></text><text x="50" y="188" class="jp h2 yellow shadow" text-anchor="start" font-size="39"><tspan x="50" dy="0">現場×AI 実践ナビゲーター</tspan></text><g transform="translate(232 210) scale(1.0)" opacity=".98">
  <ellipse cx="185" cy="96" rx="65" ry="64" fill="#986141" stroke="#180f0b" stroke-width="4"/><path d="M128 85c22-45 80-62 122-25-18-52-92-70-130-25-18 21-20 46-9 72" fill="#151116"/><path d="M150 115c12 13 28 13 40 0M203 107c18-7 34-4 48 8" stroke="#1b100b" stroke-width="5" fill="none" stroke-linecap="round"/>
